<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FORM_TITLE}}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 32px 16px; }
        .container { max-width: 540px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        h1 { font-size: 1.35rem; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
        .actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn { padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{FORM_TITLE}}</h1>
        <form method="post" action="index.php?page=lowongan">
            <input type="hidden" name="action" value="{{ACTION}}">
            <input type="hidden" name="id" value="{{ID}}">

            <div class="form-group">
                <label for="judulPosisi">Judul Posisi</label>
                <input type="text" id="judulPosisi" name="judulPosisi" value="{{JUDUL_POSISI}}" required>
            </div>

            <div class="form-group">
                <label for="departemen">Departemen</label>
                <input type="text" id="departemen" name="departemen" value="{{DEPARTEMEN}}" required>
            </div>

            <div class="form-group">
                <label for="tipeKerja">Tipe Kerja</label>
                <select id="tipeKerja" name="tipeKerja" required>
                    <option value="Full-time" {{SEL_FULLTIME}}>Full-time</option>
                    <option value="Hybrid" {{SEL_HYBRID}}>Hybrid</option>
                    <option value="Remote" {{SEL_REMOTE}}>Remote</option>
                    <option value="Contract" {{SEL_CONTRACT}}>Contract</option>
                </select>
            </div>

            <div class="form-group">
                <label for="kuota">Kuota Kebutuhan</label>
                <input type="number" id="kuota" name="kuota" min="1" value="{{KUOTA}}" required>
            </div>

            <div class="form-group">
                <label for="status">Status Lowongan</label>
                <select id="status" name="status" required>
                    <option value="Dibuka" {{SEL_DIBUKA}}>Dibuka</option>
                    <option value="Ditutup" {{SEL_DITUTUP}}>Ditutup</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Simpan</button>
                <a href="index.php?page=lowongan" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>
</body>
</html>
